<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAN Digit Generator</title>
<style>
:root{--bg:#F3F5F9;--panel:#fff;--fg:#14192B;--muted:#59627A;--line:#D5DAE6;--accent:#2F5BEA}
@media(prefers-color-scheme:dark){:root{--bg:#0E1220;--panel:#161C2E;--fg:#E8ECF6;--muted:#9AA4BC;--line:#2A3350;--accent:#7A9BFF}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding:24px 16px}
.w{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:30px}h2{margin:0;font-size:18px}
.bar,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
input,select,button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
input[type=number]{width:110px}button.p{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{display:flex;flex-direction:column;gap:10px;min-width:0}
canvas{width:100%;display:block;image-rendering:pixelated;border-radius:6px;background:#0A0D18}
.m{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:16px;align-items:center}
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}input[type=range]{width:100%}
small{color:var(--muted)}@media(max-width:700px){.pair,.m{grid-template-columns:1fr}}
</style></head><body><div class="w">
<h1>GAN Digit Generator</h1>
<div class="bar"><input id="seed" type="number" value="42" min="0" aria-label="Seed"><select id="grid" aria-label="Grid"><option value="4">4×4</option><option value="6" selected>6×6</option><option value="8">8×8</option></select><button id="gen" class="p">Generate</button><small id="st">Loading…</small></div>
<div class="pair"><div class="card"><h2>DCGAN</h2><canvas id="cDC"></canvas></div><div class="card"><h2>MLP-GAN</h2><canvas id="cML"></canvas></div></div>
<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><h2>Morph</h2><span><select id="mm" aria-label="Model"><option>DCGAN</option><option>MLP-GAN</option></select> <button id="ab">New</button></span></div>
<div class="m"><div><canvas id="cBig"></canvas><input id="t" type="range" min="0" max="100" value="50" aria-label="Blend"></div><div class="strip" id="strip"></div></div></div>
</div>
<script src="weights.js"></script><script src="gan.js"></script>
<script>
const $=i=>document.getElementById(i);let P={};
function rng(s){let a=s>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function noise(seed,n){const r=rng(seed*7919+13),z=new Float32Array(n*100);for(let i=0;i<z.length;i+=2){const u=Math.max(r(),1e-9),v=r(),m=Math.sqrt(-2*Math.log(u));z[i]=m*Math.cos(6.283185307*v);if(i+1<z.length)z[i+1]=m*Math.sin(6.283185307*v)}return z}
const gen=(n,z)=>n==='DCGAN'?genDC(P.DCGAN,z):genMLP(P['MLP-GAN'],z);
function draw(c,img,x,y){const d=c.createImageData(28,28);for(let i=0;i<784;i++){const v=Math.max(0,Math.min(255,Math.round((img[i]+1)*127.5)));d.data[4*i]=d.data[4*i+1]=d.data[4*i+2]=v;d.data[4*i+3]=255}c.putImageData(d,x,y)}
function grid(cv,name,z,n){const s=n*30;cv.width=cv.height=s;const c=cv.getContext('2d');c.fillStyle='#0A0D18';c.fillRect(0,0,s,s);for(let k=0;k<n*n;k++)draw(c,gen(name,z.subarray(k*100,k*100+100)),(k%n)*30+1,Math.floor(k/n)*30+1)}
function one(cv,name,z){cv.width=cv.height=28;draw(cv.getContext('2d'),gen(name,z),0,0)}
function render(){const n=+$('grid').value,seed=+$('seed').value||0,z=noise(seed,n*n);grid($('cDC'),'DCGAN',z,n);grid($('cML'),'MLP-GAN',z,n);$('st').textContent='Seed '+seed}
let A,B;const mix=t=>A.map((a,i)=>(1-t)*a+t*B[i]);
function ab(){const z=noise(Math.floor(Math.random()*1e5),2);A=z.slice(0,100);B=z.slice(100);morph()}
function morph(){const m=$('mm').value;one($('cBig'),m,mix($('t').value/100));const s=$('strip');if(!s.children.length)for(let i=0;i<9;i++)s.appendChild(document.createElement('canvas'));for(let i=0;i<9;i++)one(s.children[i],m,mix(i/8))}
$('gen').onclick=()=>{$('seed').value=Math.floor(Math.random()*1e6);render()};$('seed').onchange=render;$('grid').onchange=render;$('mm').onchange=morph;$('t').oninput=morph;$('ab').onclick=ab;
setTimeout(()=>{for(const k in WEIGHTS)P[k]=WEIGHTS[k].map(decode);render();ab()},30);
</script></body></html>
